<svg xmlns="http://www.w3.org/2000/svg" width="620" height="230" viewBox="0 0 620 230" font-family="Helvetica, Arial, sans-serif" font-size="15">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="620" height="230" fill="#ffffff"/>

  <g stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="55" x2="228" y2="55"/>
    <line x1="390" y1="55" x2="438" y2="55"/>
    <polyline points="520,85 520,115 100,115 100,143"/>
    <line x1="180" y1="175" x2="228" y2="175"/>
    <line x1="390" y1="175" x2="438" y2="175"/>
  </g>

  <g stroke="#4a6fa5" stroke-width="1.5">
    <rect x="20" y="25" width="160" height="60" rx="8" fill="#e8eef7"/>
    <rect x="230" y="25" width="160" height="60" rx="8" fill="#e8eef7"/>
    <rect x="440" y="25" width="160" height="60" rx="8" fill="#e8eef7"/>
    <rect x="20" y="145" width="160" height="60" rx="8" fill="#e8eef7"/>
    <rect x="230" y="145" width="160" height="60" rx="8" fill="#fdf0dc" stroke="#c08a2e"/>
    <rect x="440" y="145" width="160" height="60" rx="8" fill="#e8eef7"/>
  </g>

  <g fill="#222" text-anchor="middle">
    <text x="100" y="50" font-weight="bold">Agent</text>
    <text x="100" y="70">Gets Issue</text>
    <text x="310" y="50" font-weight="bold">Agent</text>
    <text x="310" y="70">Creates Branch</text>
    <text x="520" y="50" font-weight="bold">Agent</text>
    <text x="520" y="70">Writes plan.md</text>
    <text x="100" y="170" font-weight="bold">Agent</text>
    <text x="100" y="190">Fixes and Tests</text>
    <text x="310" y="170" font-weight="bold">Human</text>
    <text x="310" y="190">Tests Fix</text>
    <text x="520" y="170" font-weight="bold">Agent</text>
    <text x="520" y="190">Creates Pull Request</text>
  </g>
</svg>
